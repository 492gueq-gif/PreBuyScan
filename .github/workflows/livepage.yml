name: Live page check (read-only)
on:
  push:
    branches: [research/probes]
    paths: [live_page_check.py, .github/workflows/livepage.yml]
permissions:
  contents: read
jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: python live_page_check.py 0x39dbed3a2bd333467115de45665cc57f813c4571
