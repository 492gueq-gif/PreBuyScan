name: Live page check (read-only)
on:
  push:
    branches: [research/probes]
    paths: [live_page_check.py, .github/workflows/livepage.yml]
permissions:
  contents: write
jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: python live_page_check.py
      - name: Push notes
        if: always()
        run: |
          cp notes.txt /tmp/notes.txt || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan live && git rm -rfq . && cp /tmp/notes.txt . && git add notes.txt && git commit -qm "live ${GITHUB_SHA}" && git push -f origin HEAD:research/live-out
