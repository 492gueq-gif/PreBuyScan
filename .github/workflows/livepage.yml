name: Live page check (read-only)
on:
  push:
    branches: [research/probes]
    paths: [live_page_check.py, .github/workflows/livepage.yml]
permissions:
  contents: read
jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: python live_page_check.py 0x39dbed3a2bd333467115de45665cc57f813c4571 0xa01ff10774cfe53c3fbc1d7d124c42e19f6afcbd 0x555d5a1d892e5665ba38371d52f705b469367a18
