name: Candidate page check (read-only)
on:
  push:
    branches: [research/probes]
    paths: [cand_check.py, candidate/**, .github/workflows/candidate.yml]
permissions:
  contents: write
jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: python cand_check.py
      - name: Push screenshots to research/shots
        if: always()
        run: |
          mkdir -p /tmp/s && cp *.png /tmp/s/ || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan shots && git rm -rfq . && cp /tmp/s/*.png . && git add *.png && git commit -qm "screenshots ${GITHUB_SHA}" && git push -f origin HEAD:research/shots
