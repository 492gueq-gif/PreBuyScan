name: Blockscout probe (read-only)
on:
  push:
    branches: [research/probes]
    paths: [probe_blockscout.py, .github/workflows/blockscout.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python probe_blockscout.py
