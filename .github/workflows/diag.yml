name: Audit cases (temporary)
on:
  push:
    branches: [fix/audit-ext]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p out
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: node tests/diag_uhi_sell.js | tee out/uhi_sell.txt
      - run: python tests/audit_cases.py
      - if: always()
        run: |
          mkdir -p /tmp/o && cp -r out/. /tmp/o/ || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan d && git rm -rfq . && git clean -fdxq && cp -r /tmp/o/. . && git add -A && git commit -qm probe && git push origin HEAD:refs/heads/ci/probe-${GITHUB_RUN_ID}
