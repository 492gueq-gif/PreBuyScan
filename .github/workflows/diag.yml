name: Speed diagnostic (temporary)
on:
  push:
    branches: [fix/speed]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: DIAG_TOKENS=0x39dbed3a2bd333467115de45665cc57f813c4571,0xD5f1afEA47b1A9eab414D2ee740cF1d6d039E725 python tests/diag_token.py; python tests/diag_speed.py || true
      - if: always()
        run: |
          mkdir -p /tmp/o && cp -r out/. /tmp/o/ || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan d && git rm -rfq . && git clean -fdxq && cp -r /tmp/o/. . && git add -A && git commit -qm diag && git push origin HEAD:refs/heads/ci/speed-${GITHUB_RUN_ID}
