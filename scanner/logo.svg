<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PreBuyScan">
  <!-- Vector of the approved PreBuyScan mark: rounded square, geometric eye, circular iris, turquoise glow.
       Proportions measured from the approved image (container 472, eye 376x240 stroke 26, iris ring r74 stroke 22, pupil r33). -->
  <defs>
    <linearGradient id="pbs-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dffe0"/>
      <stop offset="0.55" stop-color="#43f0c0"/>
      <stop offset="1" stop-color="#22d3a6"/>
    </linearGradient>
    <radialGradient id="pbs-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#071a17"/>
      <stop offset="1" stop-color="#020807"/>
    </radialGradient>
    <filter id="pbs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#pbs-bg)"/>
  <g fill="none" stroke="url(#pbs-g)" filter="url(#pbs-glow)">
    <rect x="20" y="20" width="472" height="472" rx="112" stroke-width="22"/>
    <path d="M65.5 261.4C149.6 103.1 357.4 103.1 441.6 261.4C357.4 421.8 149.6 421.8 65.5 261.4Z" stroke-width="26" stroke-linejoin="round"/>
    <circle cx="253.5" cy="265.4" r="74" stroke-width="22"/>
  </g>
  <circle cx="253.5" cy="265.4" r="33" fill="url(#pbs-g)" filter="url(#pbs-glow)"/>
</svg>
